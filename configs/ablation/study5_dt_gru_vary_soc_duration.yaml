# Ablation study 5: continued training of DT-GRU (k=100) with random initial SOC and
# random episode duration.
name: study5_dt_gru_vary_soc_duration
description: "Study 5: DT-GRU k=100, random initial SOC and cycle duration"
env: vary_soc_duration
load_from: results/runs/study4_dt_gru_vary_soc/study4_dt_gru_vary_soc
agent:
  actor: dt
  critic: gru
  context: 100
  hidden_critic: 128
  gru_layers: 2
  dt: {hidden_size: 128, num_heads: 4, num_layers: 1}
  lr_actor: 1.0e-4   # Table II
  lr_critic: 1.0e-4   # Table II
  lr_alpha: 3.0e-4
  gamma: 0.99
  exploration_noise: pink   # roll-out only
  alpha_weight_decay: 1.0e-3
  tau: 0.005   # Table II
  alpha_init: 0.1
  target_entropy: -2.0   # Table II
  critic_grad_clip: 0.25   # Table II
  actor_grad_clip: 1.0
  log_alpha_min: -10.0
  actor_q_reduction: all
  dt_std_scaled_by_alpha: false
  dt_history_actions: normalized
seed: 2
num_episodes: 500
batch_size: 64
buffer_capacity: 5000
warmup_episodes: 10
update_every: 3          # matches the FFN lanes' cadence
actor_update_every: 5    # actor (transformer fwd+bwd) therefore runs every 15 steps, as in study1
pad_mode: edge
rtg_init: 0.95
rtg_update: subtract_normalized
save_every: 2
