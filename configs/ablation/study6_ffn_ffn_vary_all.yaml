# Ablation study 6: FFN-FFN with random initial SOC, duration and EM power scaling.
# No dedicated configuration was preserved (the validated FFN actor was produced
# on the vary_all environment); settings follow the study-5 FFN run.
name: study6_ffn_ffn_vary_all
description: "Study 6: FFN-FFN, random SOC, duration and EM power (vary_all)"
env: vary_all
load_from: results/runs/study5_ffn_ffn_vary_soc_duration/study5_ffn_ffn_vary_soc_duration
agent:
  actor: ffn
  critic: ffn
  hidden_actor: 128
  hidden_critic: 128
  lr_actor: 3.0e-5
  lr_critic: 3.0e-5
  lr_alpha: 3.0e-5
  alpha_weight_decay: 1.0e-3
  gamma: 0.99
  tau: 0.005
  alpha_init: 0.2
  target_entropy: -2.0
  critic_grad_clip: null
  actor_grad_clip: null
  log_alpha_min: -10.0
seed: 2
num_episodes: 500
batch_size: 64
buffer_capacity: 10000000
sampling: random
warmup_transitions: 70000
update_every: 3
actor_update_every: 5
save_every: 2
