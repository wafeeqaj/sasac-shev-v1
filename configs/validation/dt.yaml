# Validation roll-out settings for the DT-GRU actor as used for Tables III and IV.
agent: dt
context: 100
initial_obs: [1.0, -1.0, -1.0]
soc_range: [0.0, 0.85]           # the DT cell normalises SOC over [0, 0.85]
action_max: [267.0, 1523.0]
action_min:
  FHDS:  [-10.0, 300.0]
  US06:  [65.0, 1000.0]
  HHDDT: [-30.0, 350.0]
pm_range:
  FHDS:  [-111.0e3, 217.0e3]
  US06:  [-69.56e3, 417.0e3]
  HHDDT: [-59.56e3, 206.0e3]
initial_soc: 0.85
rtg_init: 0.95                   # decremented by the training reward / N every step
seed: 123
